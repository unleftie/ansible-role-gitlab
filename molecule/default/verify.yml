---
- name: Verify
  hosts: all
  become: true
  vars:
    github_user: "goss-org"
    github_repo: "goss"
    goss_version: "latest"
    goss_version_number: "{{ goss_version | regex_replace('^v', '') }}"
    goss_arch: "{{ goss_arch_map[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"
    goss_dst: "/usr/bin/goss"
    goss_archive: "goss_{{ goss_version_number }}_linux_{{ goss_arch }}.tar.gz"
    goss_url: "https://github.com/{{ github_user }}/{{ github_repo }}/releases/download/{{ goss_version }}/{{ goss_archive }}"
    goss_checksums_url: "https://github.com/{{ github_user }}/{{ github_repo }}/releases/download/{{ goss_version }}/goss_{{ goss_version_number }}_SHA256SUMS"
    goss_extract_directory: "/tmp/goss-extract"
    goss_test_directory: "/tmp"
    goss_format: "tap"
    goss_arch_map:
      i386: "i386"
      x86_64: "x86_64"
      aarch64: "arm64"
      armv7l: "armv6"
      armv6l: "armv6"
  tasks:
    - name: Check for defaults directory
      stat:
        path: "../../defaults"
      register: _defaults_dir

    - name: Check for vars directory
      stat:
        path: "../../vars"
      register: _vars_dir

    - name: Include defaults vars
      include_vars:
        dir: "../../defaults"
        extensions: ["yml", "yaml"]
      when: _defaults_dir.stat.exists

    - name: Include vars
      include_vars:
        dir: "../../vars"
        extensions: ["yml", "yaml"]
      when: _vars_dir.stat.exists

    - name: Ensure dependencies are installed
      pip:
        name: github3.py
        break_system_packages: true
      register: _progress_status
      until: _progress_status is succeeded
      delay: 5
      retries: 5

    - name: Get latest Goss release
      block:
        - name: Get latest release
          community.general.github_release:
            user: "{{ github_user }}"
            repo: "{{ github_repo }}"
            token: "{{ lookup('env', 'GITHUB_TOKEN') }}"
            action: latest_release
          register: _latest_release
          until: _latest_release is succeeded
          delay: 5
          retries: 5

        - name: "Set version tag to {{ _latest_release.tag }}"
          set_fact:
            goss_version: "{{ _latest_release.tag }}"
      when: goss_version == "latest"
      run_once: true

    - name: Download Goss archive
      get_url:
        url: "{{ goss_url }}"
        dest: "/tmp/{{ goss_archive }}"
        checksum: "sha256:{{ goss_checksums_url }}"
        mode: "0644"
        headers:
          Authorization: "Bearer {{ lookup('env', 'GITHUB_TOKEN') }}"
      register: _progress_status
      until: _progress_status is succeeded
      delay: 5
      retries: 5

    - name: Ensure Goss extract directory exists
      file:
        path: "{{ goss_extract_directory }}"
        state: directory
        mode: "0755"

    - name: Extract Goss archive
      unarchive:
        src: "/tmp/{{ goss_archive }}"
        dest: "{{ goss_extract_directory }}"
        remote_src: true

    - name: Install Goss binary
      copy:
        src: "{{ goss_extract_directory }}/goss"
        dest: "{{ goss_dst }}"
        mode: "0755"
        remote_src: true

    - name: Copy Goss tests to remote
      template:
        src: "{{ item }}"
        dest: "{{ goss_test_directory }}/{{ item | basename | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      with_fileglob:
        - "{{ lookup('env', 'MOLECULE_VERIFIER_TEST_DIRECTORY') }}/*.yml.j2"

    - name: Register test files
      shell: "ls {{ goss_test_directory }}/*.yml"
      changed_when: false
      register: test_files

    - name: Execute Goss tests
      environment:
        PATH: "/opt/rh/rh-git218/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      command: "{{ goss_dst }} -g {{ item }} validate -f {{ goss_format }}"
      changed_when: false
      register: test_results
      with_items: "{{ test_files.stdout_lines }}"
      ignore_errors: true

    - name: Display details about the results
      debug:
        msg: "{{ item.stdout_lines }}"
      with_items: "{{ test_results.results }}"

    - name: Fail when tests fail
      fail:
        msg: "Goss failed to validate"
      when: item.rc != 0
      with_items: "{{ test_results.results }}"
